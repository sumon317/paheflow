[package]
name = "animepahe-gui-desktop"
version = "2.0.0"
description = "Native Linux AnimePahe Desktop Window (Tauri)"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
animepahe-gui = { path = ".." }

[build-dependencies]
tauri-build = { version = "2", features = [] }
