[package]
name = "paheflow-desktop"
version = "1.0.0"
description = "Native Linux PaheFlow Desktop Window (Tauri)"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
animepahe_gui = { package = "paheflow", path = ".." }

[build-dependencies]
tauri-build = { version = "2", features = [] }
